[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oledify"
version = "0.1.0"
description = "Convert any wallpaper for OLED/AMOLED screens: true-black crush and resize presets."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rooman Ahmed" }]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "Pillow>=10.4",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "nuitka>=2.4",
]

[project.scripts]
oledify = "oledify.main:main"

[project.urls]
Homepage = "https://github.com/rooman-dev/oledify"

[tool.hatch.build.targets.wheel]
packages = ["src/oledify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
